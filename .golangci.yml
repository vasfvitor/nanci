version: "2"

run:
  timeout: 5m
  tests: true
  concurrency: 4

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused

    # HTTP / context / resource safety
    - bodyclose
    - noctx
    - contextcheck

    # SQL / resource safety
    - sqlclosecheck
    - rowserrcheck

    # Error correctness
    - errorlint
    - nilerr
    - nilnesserr
    - nilnil

    # Security
    - gosec

    # Maintainability / DX
    - revive
    - gocritic
    - depguard
    - unconvert
    - misspell
    - predeclared
    - copyloopvar
    - durationcheck
    - makezero
    - nolintlint

    # slog consistency
    - sloglint

  exclusions:
    rules:
      # RSA-SHA1 is mandated by the NF-e XMLDSig profile.
      - path: internal/sefaz/
        linters:
          - gosec
        text: "G401|G505"

  settings:
    depguard:
      rules:
        app-core:
          files:
            - "**/internal/app/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/vasfvitor/nanci/internal/store"
              desc: "Core business logic (app) cannot depend on the database layer."
            - pkg: "database/sql"
              desc: "Core business logic (app) cannot depend on SQL."
        domain:
          files:
            - "**/internal/nfse/**/*.go"
            - "**/internal/nfe/**/*.go"
            - "**/internal/dfe/**/*.go"
            - "**/internal/cte/**/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/vasfvitor/nanci/internal/app"
              desc: "Domain models cannot depend on application services."
            - pkg: "github.com/vasfvitor/nanci/internal/store"
              desc: "Domain models cannot depend on the database layer."
            - pkg: "database/sql"
              desc: "Domain models cannot depend on SQL."

    misspell:
      ignore-rules:
        - adn
        - autor
        - correspondente

    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
        - (*compress/gzip.Reader).Close

        - (*github.com/spf13/cobra.Command).MarkFlagRequired

    gosec:
      excludes:
        - G404

    revive:
      rules:
        - name: unused-parameter
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/vasfvitor/nanci