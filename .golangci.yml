version: "2"

run:
  timeout: 5m
  tests: true
  concurrency: 4

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused

    # HTTP / context / resource safety
    - bodyclose
    - noctx
    - contextcheck

    # SQL / resource safety
    - sqlclosecheck
    - rowserrcheck

    # Error correctness
    - errorlint
    - nilerr
    - nilnesserr
    - nilnil

    # Security
    - gosec

    # Maintainability / DX
    - gocritic
    - unconvert
    - predeclared
    - durationcheck
    - makezero
    - nolintlint
    
    # slog consistency
    - sloglint

linters-settings:
  errcheck:
    exclude-functions:
      - (*database/sql.Tx).Rollback
      - (*database/sql.Rows).Close
      - (*compress/gzip.Reader).Close
      - (*github.com/spf13/cobra.Command).MarkFlagRequired

  gosec:
    excludes:
      - G404

formatters:
  enable:
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/vasfvitor/nanci
