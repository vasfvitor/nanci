name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/screenshots/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Copy screenshots
        run: bash website/scripts/copy-screenshots.sh

      - name: Build
        working-directory: website
        run: hugo --minify --baseURL "https://vasfvitor.github.io/nanci/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
