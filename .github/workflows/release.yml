name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Read release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            is_release="true"
          else
            tag="v0.0.0-dev"
            is_release="false"
          fi

          version="${tag#v}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

      - name: Validate SemVer and compare with previous
        if: steps.version.outputs.is_release == 'true'
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"

          if ! [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$tag' is not a valid strict semver. Expected format: vX.Y.Z"
            exit 1
          fi

          prev_tag=$(
            git ls-remote --tags --refs origin \
              | awk -F '/' '{print $3}' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -v "^${tag}$" \
              | sort -V \
              | tail -n 1
          )

          if [ -z "$prev_tag" ]; then
            echo "No previous valid semver tags found. Proceeding as first release."
            exit 0
          fi

          echo "Previous highest version: $prev_tag"
          echo "Current version: $tag"

          highest=$(printf "%s\n%s\n" "$prev_tag" "$tag" | sort -V | tail -n 1)

          if [ "$highest" != "$tag" ]; then
            echo "::error::New version ($tag) must be greater than previous highest version ($prev_tag)."
            exit 1
          fi

          echo "Validation passed: $tag is greater than $prev_tag."

      # A release ships an app that installs updates only when they carry a
      # signature from this key, so a tag never builds without the public key
      # pinned in the app or the private key that signs for it. See
      # docs/WAILS_V3.md, "Atualização automática".
      - name: Require the updater keys
        if: steps.version.outputs.is_release == 'true'
        shell: bash
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: |
          if ! grep -Eq '^var updaterPublicKey = "[A-Za-z0-9+/]{43}="$' internal/desktop/updater_key.go; then
            echo "::error::internal/desktop/updater_key.go has no updater public key (base64 of the raw 32-byte Ed25519 key)."
            exit 1
          fi
          if [ -z "$UPDATER_SIGNING_KEY" ]; then
            echo "::error::The UPDATER_SIGNING_KEY secret is missing."
            exit 1
          fi

  checks:
    uses: ./.github/workflows/ci.yml

  build-desktop:
    needs:
      - prepare
      - checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # The Windows build is pure Go (no cgo), so NSIS is the only system
      # package the installer needs.
      - name: Install NSIS
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            internal/desktop/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.33.0'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'internal/desktop/frontend/pnpm-lock.yaml'

      - name: Install frontend dependencies
        working-directory: ./internal/desktop/frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Go Binaries
        id: cache-go-bins
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bins-wails3-v3.0.0

      # Without cgo the CLI builds on Linux with no GTK headers; the app build
      # itself targets Windows.
      - name: Install Wails CLI
        if: steps.cache-go-bins.outputs.cache-hit != 'true'
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Build Desktop Installer
        working-directory: ./internal/desktop
        env:
          # The build regenerates frontend/bindings, and the generator only
          # finds the App service when it analyses the Windows build.
          GOOS: windows
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.prepare.outputs.version }}"
          commit="${GITHUB_SHA::7}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The exe and installer metadata take numbers only: a manual run's
          # 0.0.0-dev becomes 0.0.0 there and stays whole in buildinfo.
          asset_version="${version%%-*}"

          echo "Writing version $asset_version to build/config.yml..."
          sed -i -E "s/^  version: \"[^\"]*\"/  version: \"$asset_version\"/" build/config.yml
          grep -q "^  version: \"$asset_version\"$" build/config.yml

          # Regenerates build/windows/info.json, the manifest and
          # build/windows/nsis/wails_tools.nsh from config.yml.
          wails3 task common:update:build-assets

          echo "Building the installer..."
          wails3 task windows:package \
            EXTRA_LDFLAGS="-X 'github.com/vasfvitor/nanci/internal/foundation/buildinfo.Version=$version' -X 'github.com/vasfvitor/nanci/internal/foundation/buildinfo.Commit=$commit' -X 'github.com/vasfvitor/nanci/internal/foundation/buildinfo.Date=$date'"

          test -s bin/nanci-desktop-amd64-installer.exe
          test -s bin/nanci-desktop.exe

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nanci-desktop-windows-amd64-installer
          path: internal/desktop/bin/nanci-desktop-amd64-installer.exe
          if-no-files-found: error
          retention-days: 7

      # The exe the installer packs, which the automatic update downloads.
      - name: Upload Desktop Executable
        uses: actions/upload-artifact@v7
        with:
          name: nanci-desktop-windows-amd64-exe
          path: internal/desktop/bin/nanci-desktop.exe
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: needs.prepare.outputs.is_release == 'true'
    needs:
      - prepare
      - build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download Desktop Artifact
        uses: actions/download-artifact@v7
        with:
          name: nanci-desktop-windows-amd64-installer
          path: artifacts/desktop

      - name: Download Desktop Executable
        uses: actions/download-artifact@v7
        with:
          name: nanci-desktop-windows-amd64-exe
          path: artifacts/desktop-exe

      - name: Stage Release Assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          tag="${{ needs.prepare.outputs.tag }}"
          installer_name="nanci-desktop-windows-amd64-${tag}-installer.exe"
          exe_name="nanci-desktop-windows-amd64-${tag}.exe"

          cp artifacts/desktop/nanci-desktop-amd64-installer.exe "release/$installer_name"
          cp artifacts/desktop-exe/nanci-desktop.exe "release/$exe_name"

          test -s "release/$installer_name"
          test -s "release/$exe_name"

          (
            cd release
            sha256sum "$installer_name" "$exe_name" > nanci-checksums.txt
          )

          echo "Release assets:"
          ls -lh release

          echo "Checksums:"
          cat release/nanci-checksums.txt

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go Binaries
        id: cache-go-bins
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bins-wails3-v3.0.0

      - name: Install Wails CLI
        if: steps.cache-go-bins.outputs.cache-hit != 'true'
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      # The app reads releases/latest/download/nanci-update.json, the Wails
      # update manifest: the exe's URL in this release, its SHA-512 digest
      # and an Ed25519ph signature of that digest. verify checks the manifest
      # with the public key pinned in the app, so a secret that does not
      # match it fails the release instead of shipping an update nobody can
      # install.
      - name: Sign Update Manifest
        shell: bash
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: |
          set -euo pipefail

          tag="${{ needs.prepare.outputs.tag }}"
          version="${{ needs.prepare.outputs.version }}"
          exe_name="nanci-desktop-windows-amd64-${tag}.exe"
          key_file="$RUNNER_TEMP/updater.key"
          notes_file="$RUNNER_TEMP/update-notes.md"
          trap 'rm -f "$key_file"' EXIT

          if [ -z "$UPDATER_SIGNING_KEY" ]; then
            echo "::error::The UPDATER_SIGNING_KEY secret is missing."
            exit 1
          fi
          public_key="$(sed -nE 's/^var updaterPublicKey = "([A-Za-z0-9+/]{43}=)"$/\1/p' internal/desktop/updater_key.go)"
          if [ -z "$public_key" ]; then
            echo "::error::internal/desktop/updater_key.go has no updater public key."
            exit 1
          fi

          (umask 077 && printf '%s\n' "$UPDATER_SIGNING_KEY" > "$key_file")
          git log -1 --format='%b' > "$notes_file"

          wails3 updater manifest \
            -version "$version" \
            -key "$key_file" \
            -url-prefix "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/" \
            -notes-file "$notes_file" \
            -output release/nanci-update.json \
            "release/$exe_name"

          wails3 updater verify -manifest release/nanci-update.json -publickey "$public_key"

          cat release/nanci-update.json

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/*.exe
            release/nanci-checksums.txt
            release/nanci-update.json

      - name: Generate Release Notes
        shell: bash
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          installer_name="nanci-desktop-windows-amd64-${tag}-installer.exe"
          exe_name="nanci-desktop-windows-amd64-${tag}.exe"
          commit_desc=$(git log -1 --format='%b')
          
          cat <<EOF > release_notes.md
          $commit_desc
          
          ## Nota de segurança

          As versões para Windows atualmente não possuem assinatura digital. Alguns antivírus podem relatar falsos positivos (detecções genéricas/ML) no instalador NSIS ou no executável devido à baixa reputação inicial do binário.

          Os arquivos de release são compilados pelo GitHub Actions e incluem checksums SHA-256 e atestados de proveniência do GitHub (artifact attestations).

          ## Download

          - \`$installer_name\`

          A atualização automática do app usa \`$exe_name\` e \`nanci-update.json\` (assinado com Ed25519); não é preciso baixá-los.

          Checksum SHA-256:

          - \`nanci-checksums.txt\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.tag }}
          draft: false
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          body_path: release_notes.md
          files: |
            release/*.exe
            release/nanci-checksums.txt
            release/nanci-update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}