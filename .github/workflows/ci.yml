name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Wails' Linux backend needs cgo and the GTK headers. The desktop app
      # ships only for Windows, so build and test both modules without cgo.
      CGO_ENABLED: '0'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            internal/desktop/go.sum

      - name: Create go.work
        run: go work init . ./internal/desktop ./third_party/go-pkcs12

      # Satisfy Wails' go:embed frontend/dist. The frontend job builds the
      # real bundle.
      - name: Stub frontend dist
        run: |
          mkdir -p internal/desktop/frontend/dist
          echo '<div></div>' > internal/desktop/frontend/dist/index.html

      - name: Build
        run: go build ./... ./internal/desktop/...

      - name: Test
        run: go test ./... ./internal/desktop/...

      - name: Lint root module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Lint desktop module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: internal/desktop
          skip-save-cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Vulnerability check root module
        run: govulncheck ./...

      - name: Vulnerability check desktop module
        working-directory: ./internal/desktop
        run: govulncheck ./...

  tidy:
    name: Go mod tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            internal/desktop/go.sum

      - name: Create go.work
        run: go work init . ./internal/desktop ./third_party/go-pkcs12

      - name: Tidy root module
        run: GOWORK=off go mod tidy

      - name: Tidy desktop module
        working-directory: ./internal/desktop
        run: GOWORK=off go mod tidy

      - name: Check for drift
        run: |
          if ! git diff --exit-code -- go.mod go.sum internal/desktop/go.mod internal/desktop/go.sum; then
            echo "::error::go.mod or go.sum is stale. Run 'GOWORK=off go mod tidy' in the repo root and in internal/desktop, then commit the result."
            exit 1
          fi

  bindings:
    name: Wails bindings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            internal/desktop/go.sum

      - name: Cache Go Binaries
        id: cache-go-bins
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bins-wails-2.16.0

      - name: Install Wails CLI
        if: steps.cache-go-bins.outputs.cache-hit != 'true'
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Create go.work
        run: go work init . ./internal/desktop ./third_party/go-pkcs12

      # Satisfy Wails' go:embed frontend/dist.
      - name: Stub frontend dist
        run: |
          mkdir -p internal/desktop/frontend/dist
          echo '<div></div>' > internal/desktop/frontend/dist/index.html

      # The bindings build tag leaves out Wails' Linux frontend, so no cgo or
      # GTK headers are needed.
      - name: Generate bindings
        working-directory: ./internal/desktop
        env:
          CGO_ENABLED: '0'
        run: wails generate module

      # git status also catches files the generator adds, which git diff misses.
      - name: Check for drift
        run: |
          if [ -n "$(git status --porcelain -- internal/desktop/frontend/wailsjs)" ]; then
            git status --short -- internal/desktop/frontend/wailsjs
            git diff -- internal/desktop/frontend/wailsjs
            echo "::error::Wails bindings are stale. Run 'wails generate module' in internal/desktop, then commit frontend/wailsjs."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./internal/desktop/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.33.0'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'internal/desktop/frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build
