name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# scripts/verify.sh runs these checks locally and reads WAILS_VERSION,
# SQLC_VERSION, the golangci-lint version and the govulncheck version from
# this file: keep it in step when a job changes.
env:
  # The install steps build the Wails CLI without cgo, which on Linux would
  # need the GTK 4 and WebKitGTK headers (internal/operatingsystem).
  WAILS_VERSION: v3.0.0
  SQLC_VERSION: v1.27.0

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The root module builds and tests without cgo. Wails v3 on Linux
      # compiles only with cgo and the GTK 4 and WebKitGTK 6.0 headers, so
      # the desktop steps turn cgo on.
      CGO_ENABLED: '0'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            internal/desktop/go.sum

      - name: Create go.work
        run: go work init . ./internal/desktop ./third_party/go-pkcs12

      # Satisfy Wails' go:embed frontend/dist. The frontend job builds the
      # real bundle.
      - name: Stub frontend dist
        run: |
          mkdir -p internal/desktop/frontend/dist
          echo '<div></div>' > internal/desktop/frontend/dist/index.html

      # Package names from the Wails v3.0.0 doctor (apt): GTK 4 and
      # WebKitGTK 6.0 are the default Linux stack.
      - name: Install GTK and WebKitGTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build root module
        run: go build ./...

      - name: Build desktop module
        env:
          CGO_ENABLED: '1'
        run: go build ./internal/desktop/...

      - name: Test root module
        run: go test ./...

      - name: Test desktop module
        env:
          CGO_ENABLED: '1'
        run: go test ./internal/desktop/...

      - name: Lint root module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Lint desktop module
        uses: golangci/golangci-lint-action@v9
        env:
          CGO_ENABLED: '1'
        with:
          version: v2.12.2
          working-directory: internal/desktop
          skip-save-cache: true

      - name: Cache Go Binaries
        id: cache-go-bins
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bins-govulncheck-v1.1.4

      - name: Install govulncheck
        if: steps.cache-go-bins.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Vulnerability check root module
        run: govulncheck ./...

      - name: Vulnerability check desktop module
        working-directory: ./internal/desktop
        env:
          CGO_ENABLED: '1'
        run: govulncheck ./...

  # The app ships only for Windows. This job runs the Windows-only files
  # (theme_windows.go, uninstall_windows.go) and the path and file handling
  # through vet, tests and lint, which the Linux job never compiles.
  go-windows:
    name: Go (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # Wails v3 on Windows and the SQLite driver are pure Go.
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            internal/desktop/go.sum

      - name: Create go.work
        run: go work init . ./internal/desktop ./third_party/go-pkcs12

      # Satisfy Wails' go:embed frontend/dist.
      - name: Stub frontend dist
        run: |
          mkdir -p internal/desktop/frontend/dist
          echo '<div></div>' > internal/desktop/frontend/dist/index.html

      - name: Vet
        run: go vet ./... ./internal/desktop/...

      - name: Test root module
        run: go test ./...

      - name: Test desktop module
        run: go test ./internal/desktop/...

      # The root module has no Windows-only files; the Linux job lints it.
      - name: Lint desktop module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: internal/desktop

  tidy:
    name: Go mod tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Tidy root module
        run: GOWORK=off go mod tidy

      - name: Tidy desktop module
        working-directory: ./internal/desktop
        run: GOWORK=off go mod tidy

      # sqlc reads the queries and the migrations; diff exits non-zero when
      # internal/store/sqlgen does not match them.
      - name: Check sqlc output
        env:
          CGO_ENABLED: '0'
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@${{ env.SQLC_VERSION }} diff

      - name: Check for drift
        run: |
          if ! git diff --exit-code -- go.mod go.sum internal/desktop/go.mod internal/desktop/go.sum; then
            echo "::error::go.mod or go.sum is stale. Run 'GOWORK=off go mod tidy' in the repo root and in internal/desktop, then commit the result."
            exit 1
          fi

  bindings:
    name: Wails bindings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go Binaries
        id: cache-go-bins
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bins-wails3-${{ env.WAILS_VERSION }}

      - name: Install Wails CLI
        if: steps.cache-go-bins.outputs.cache-hit != 'true'
        env:
          CGO_ENABLED: '0'
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Create go.work
        run: go work init . ./internal/desktop ./third_party/go-pkcs12

      # Satisfy Wails' go:embed frontend/dist.
      - name: Stub frontend dist
        run: |
          mkdir -p internal/desktop/frontend/dist
          echo '<div></div>' > internal/desktop/frontend/dist/index.html

      # The generator type-checks the desktop module. Wails v3 on Linux needs
      # cgo and GTK, and without them the generator finds no service and only
      # warns, so it analyses the Windows build the app ships.
      - name: Generate bindings
        working-directory: ./internal/desktop
        env:
          GOOS: windows
          CGO_ENABLED: '0'
        run: wails3 generate bindings -clean=true -ts -i

      # git status also catches files the generator adds, which git diff misses.
      - name: Check for drift
        run: |
          # Staging runs the .gitattributes normalization, so a CRLF written by
          # the generator is not drift; a changed or new file still is. File
          # modes are not drift either.
          git config core.fileMode false
          git add -A -- internal/desktop/frontend/bindings
          if ! git diff --cached --exit-code --stat -- internal/desktop/frontend/bindings; then
            git diff --cached -- internal/desktop/frontend/bindings
            echo "::error::Wails bindings are stale. Run 'wails3 generate bindings -clean=true -ts -i' in internal/desktop, then commit frontend/bindings."
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./internal/desktop/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.33.0'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'internal/desktop/frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build
